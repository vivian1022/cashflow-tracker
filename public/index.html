<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cashflow Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>💰 Cashflow Tracker</h1>
    <button id="exportBtn" class="btn ghost">⬇ Export CSV</button>
  </header>

  <main>
    <!-- Add transaction -->
    <section class="card">
      <h2>Add Transaction</h2>
      <form id="txForm">
        <div class="field">
          <label>Date</label>
          <input type="date" id="txDate" required />
        </div>
        <div class="field">
          <label>Type</label>
          <div class="toggle">
            <button type="button" id="dirIn" class="toggle-btn active">Money In</button>
            <button type="button" id="dirOut" class="toggle-btn">Money Out</button>
          </div>
        </div>
        <div class="field">
          <label>Amount</label>
          <input type="number" id="txAmount" step="0.01" min="0.01" required placeholder="0.00" />
        </div>
        <div class="field">
          <label>Category</label>
          <select id="txCategory" required></select>
        </div>
        <div class="field">
          <label>Description</label>
          <input type="text" id="txDesc" required placeholder="e.g. Invoice #1023 payment" />
        </div>
        <button type="submit" class="btn primary">Add</button>
        <span id="txMsg" class="msg"></span>
      </form>
    </section>

    <!-- Forecast -->
    <section class="card">
      <h2>Next Month Forecast</h2>
      <div id="forecastBody" class="forecast">Loading…</div>
    </section>

    <!-- Weekly summary -->
    <section class="card wide">
      <h2>Weekly Summary (last 8 weeks)</h2>
      <div class="chart-wrap"><canvas id="weeklyChart"></canvas></div>
      <table id="weeklyTable">
        <thead>
          <tr><th>Week</th><th>Money In</th><th>Money Out</th><th>Net</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- Monthly by category -->
    <section class="card wide">
      <h2>Monthly by Category (last 6 months)</h2>
      <div class="chart-wrap"><canvas id="monthlyChart"></canvas></div>
      <div id="monthlyLegend" class="legend"></div>
    </section>

    <!-- Transactions -->
    <section class="card wide">
      <h2>Recent Transactions</h2>
      <table id="txTable">
        <thead>
          <tr><th>Date</th><th>Description</th><th>Category</th><th>Type</th><th class="r">Amount</th><th></th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
